name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/zephyr-control"

      - name: Boot the Pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/zephyr-control
            
            # 1. Update and install dependencies
            sudo apt-get update -yq
            sudo apt-get install -yq python3-venv python3-pip python3-full
            
            # 2. Build environment
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # 3. Install packages using the absolute path (bypassing 'source activate')
            /home/ubuntu/zephyr-control/venv/bin/pip install -r requirements.txt
            
            # 4. Kill the old instance securely
            pkill -f "uvicorn main:app" || true
            sleep 1
            
            # 5. Run completely detached in a new session group
            setsid /home/ubuntu/zephyr-control/venv/bin/uvicorn main:app --host 127.0.0.1 --port 5000 > backend.log 2>&1 < /dev/null &
            
            # 6. Force the SSH session to close instantly
            exit 0