name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/zephyr-control"

      - name: Boot the Pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/zephyr-control
            
            # 1. Ensure system dependencies are installed silently
            sudo apt-get update -yq
            sudo apt-get install -yq python3-venv python3-pip python3-full
            
            # 2. Build the virtual environment if missing
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # 3. Activate and update project dependencies
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 4. Terminate the old engine instance securely
            pkill -f "uvicorn main:app" || true
            
            # 5. Ignite the new engine in the background completely detached
            nohup uvicorn main:app --host 127.0.0.1 --port 5000 </dev/null > backend.log 2>&1 &
            sleep 2